services:
  postgres:
    # PostgreSQL 18 is required, not optional: the baseline schema defaults
    # primary keys with uuidv7(), which only exists from PG 18. On 17 the first
    # migration fails with 'function uuidv7() does not exist'. If you already
    # have a volume from an older image, recreate it (the data directory is not
    # downgrade-compatible): docker compose down -v && docker compose up -d.
    image: postgres:18-alpine
    container_name: transitops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: transitops_dev
      POSTGRES_USER: transitops
      POSTGRES_PASSWORD: transitops_local_dev_password

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - transitops_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U transitops -d transitops_dev"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transitops_postgres_data:
    name: transitops_postgres_data
