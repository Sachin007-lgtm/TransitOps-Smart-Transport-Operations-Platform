services:
  postgres:
    image: postgres:17-alpine
    container_name: transitops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: transitops_dev
      POSTGRES_USER: transitops
      POSTGRES_PASSWORD: transitops_local_dev_password

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - transitops_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U transitops -d transitops_dev"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transitops_postgres_data:
    name: transitops_postgres_data
